name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, for example 1.0.0-rc.1"
        required: true
        type: string
      publish_nuget:
        description: "Publish packages to NuGet"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build, pack, and release
    runs-on: ubuntu-latest

    env:
      CONFIGURATION: Release
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            Monica.slnx
            tests/Directory.Build.props
            tests/Directory.Packages.props
            **/*.csproj

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CURRENT_REF="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          else
            VERSION="${{ inputs.version }}"
            CURRENT_REF="${GITHUB_SHA}"
          fi

          if [[ -z "${VERSION}" ]]; then
            echo "Version is required." >&2
            exit 1
          fi

          if [[ "${VERSION}" == *"-"* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "target_commitish=${CURRENT_REF}" >> "${GITHUB_OUTPUT}"

          if PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${CURRENT_REF}^" 2>/dev/null)"; then
            RELEASE_NOTES_RANGE="${PREVIOUS_TAG}..${CURRENT_REF}"
          else
            RELEASE_NOTES_RANGE="${CURRENT_REF}"
          fi

          echo "release_notes_args=${RELEASE_NOTES_RANGE} --tag v${VERSION} --strip header" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        id: release_notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: ${{ steps.version.outputs.release_notes_args }}
          github_token: ${{ github.token }}
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Restore solution
        run: dotnet restore Monica.slnx

      - name: Build solution
        run: dotnet build Monica.slnx --configuration "${CONFIGURATION}" --no-restore -m -p:Version=${{ steps.version.outputs.version }}

      - name: Test solution
        run: dotnet test Monica.slnx --configuration "${CONFIGURATION}" --no-build --verbosity minimal --logger "trx;LogFilePrefix=release-tests" --results-directory tests/TestResults -m

      - name: Pack packages
        run: dotnet pack Monica.slnx --configuration "${CONFIGURATION}" --no-build --output artifacts/packages -p:Version=${{ steps.version.outputs.version }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: monica-packages-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Publish to NuGet
        if: ${{ env.NUGET_API_KEY != '' && (github.event_name == 'push' || inputs.publish_nuget) }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Monica ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ steps.version.outputs.target_commitish }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
