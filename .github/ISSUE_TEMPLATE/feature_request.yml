name: Feature request
description: Suggest a Monica feature or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: area
    attributes:
      label: Area
      placeholder: JobScheduler, UI, Repository, agent skills, docs, etc.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, behavior, or documentation change you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions first.
          required: true
