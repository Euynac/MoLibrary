# git-cliff configuration for Monica release notes.
# Release notes are generated from commit messages between release tags.

[changelog]
body = """
{% if commits | length == 0 -%}
No release-note changes were found for this version.
{% else -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}

{% endfor -%}
{% endif -%}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"

commit_parsers = [
    { message = "^Merge pull request", skip = true },
    { message = "^Merge remote-tracking branch", skip = true },
    { message = "^Merge branch", skip = true },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^Prepare [0-9].* release", skip = true },
    { message = "^[a-zA-Z]+(\\([^)]+\\))?!:.*", group = "Breaking Changes" },
    { body = "BREAKING CHANGE:", group = "Breaking Changes" },
    { message = "^feat", group = "Features" },
    { message = "^feature", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs?", group = "Documentation" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^test", group = "Tests" },
    { message = "^style", group = "Style" },
    { message = "^revert", group = "Reverts" },
    { message = "^chore\\(deps", group = "Dependencies" },
    { message = "^chore", group = "Maintenance" },
    { message = ".*", group = "Other Changes" },
]
