<svg xmlns="http://www.w3.org/2000/svg" width="190" height="32" viewBox="0 0 190 32" role="img" aria-labelledby="title description">
  <title id="title">Monica Open Source badge</title>
  <desc id="description">A README badge identifying an independently maintained Monica extension as open source.</desc>
  <clipPath id="badge-shape">
    <rect width="190" height="32" rx="7"/>
  </clipPath>
  <g clip-path="url(#badge-shape)">
    <rect width="74" height="32" fill="#047857"/>
    <rect x="74" width="116" height="32" fill="#10B981"/>
  </g>
  <g fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="37" y="20">MONICA</text>
    <text x="132" y="20">OPEN SOURCE</text>
  </g>
</svg>
